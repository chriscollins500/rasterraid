name: Publish RasterRaid Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/stage-pages.mjs'
      - 'src/visual-text-pack.mjs'
      - '.github/workflows/publish-pages.yml'

permissions:
  contents: read

concurrency:
  group: rasterraid-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'chriscollins500/rasterraid' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Stage checked site and pinned release pack
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node site/build.mjs --check
          if ! gh release view v0.0.8 --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == false' | grep -qx true; then
            echo 'The visual model release is unavailable.'
            exit 0
          fi
          gh release download v0.0.8 --repo "$GITHUB_REPOSITORY" --pattern rasterraid-visual-model-v1.rrvision --dir "$RUNNER_TEMP"
          node scripts/stage-pages.mjs "$RUNNER_TEMP/rasterraid-visual-model-v1.rrvision" "$RUNNER_TEMP/rasterraid-pages"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.release.outputs.ready == 'true'
        with:
          path: ${{ runner.temp }}/rasterraid-pages

  deploy:
    if: needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
