name: Request an improvement
description: Suggest a search, report, filter or documentation improvement.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to find or do?
      description: Describe the task and what would make it easier in RasterRaid.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Public example
      description: Include a public Civitai example if it helps illustrate the request.
